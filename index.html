<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The personal portfolio of James McShane, cinematographer, director, and developer.">
  <title>James McShane | Portfolio</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d1015;
      color: #f4f1e8;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 18% 18%, rgba(176, 108, 88, 0.2), transparent 38rem),
        #0d1015;
    }

    main {
      width: min(44rem, calc(100% - 3rem));
      padding: 5rem 0;
    }

    p {
      margin: 0;
      color: #b8b6b0;
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.7;
    }

    .eyebrow {
      margin-bottom: 1.25rem;
      color: #d78c73;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 10ch;
      margin: 0 0 1.5rem;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3.4rem, 11vw, 7.6rem);
      font-weight: 400;
      line-height: 0.92;
      letter-spacing: -0.05em;
    }

    a {
      display: inline-block;
      margin-top: 2rem;
      color: #f4f1e8;
      text-underline-offset: 0.35em;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Cinematographer · Director · Developer</p>
    <h1>James McShane</h1>
    <p>A new portfolio is taking shape. Film, visual storytelling, and the software I build will live here.</p>
    <a href="https://github.com/james-mcshane">View GitHub profile</a>
  </main>
</body>
</html>
